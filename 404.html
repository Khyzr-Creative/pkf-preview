<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Private preview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23F26A2C'/%3E%3C/svg%3E">
<link rel="preload" href="/pkf-preview/f/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.className = 'js is-checking';</script>
<style>
/* The sign-in: the showcase's face and colours, its blush panel where the front page has it, so the page that opens
   seems to have been behind this one all along; and nothing that names whose work is behind it. */
@font-face { font-family: "Fredoka"; font-style: normal; font-weight: 300 700; font-stretch: 75% 125%; font-display: swap; src: url(/pkf-preview/f/fredoka.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
:root {
  --cream: #FBF2E7; --paper: #FFFAF3; --ink: #141210; --ink-2: #625850; --tangerine: #F26A2C; --cobalt: #2448C8; --blush: #F7CDD3; --err: #B42318;
  --line: rgba(20, 18, 16, .1); --face: "Fredoka", "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  --gutter: clamp(16px, 4.4vw, 56px); --r-lg: clamp(22px, 2vw, 32px);
  --ease: cubic-bezier(.16, 1, .3, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--cream); color: var(--ink); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100svh; font-family: var(--face); font-size: 1.0625rem; line-height: 1.45; font-weight: 450; caret-color: var(--cobalt); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 3px; }
::selection { background: var(--tangerine); color: var(--ink); }

/* The panel: the lock at its head, the words across its middle, how it opens at its foot */
.say { padding: 10px 10px 0; }
.say__in { display: grid; grid-template-rows: auto minmax(28px, 1fr) auto auto; min-height: clamp(280px, 44svh, 500px); padding: clamp(18px, 3.2vw, 36px); border-radius: var(--r-lg); background: var(--blush); container-type: inline-size; }
.lock { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--cream); color: var(--tangerine); transform: rotate(-8deg); box-shadow: 0 1px 0 rgba(20, 18, 16, .05), 0 8px 18px -10px rgba(20, 18, 16, .45); }
.lock svg { width: 20px; height: 20px; }
.say h1 { grid-row: 3; margin: 0; color: var(--cobalt); font-size: min(19.5cqi, 9rem); font-weight: 600; line-height: .84; letter-spacing: -.035em; }
.say h1 span { display: block; }
.say__lead { grid-row: 4; max-width: 22em; margin: clamp(16px, 2.2vw, 26px) 0 0; font-size: clamp(1rem, .94rem + .3vw, 1.25rem); font-weight: 500; line-height: 1.35; text-wrap: pretty; }

/* The form, on the cream: two cards to write in, the one choice, the way in */
.door { padding: clamp(28px, 6vw, 56px) var(--gutter) 48px; }
.gate__form, .gate__note { max-width: 27rem; }
html:not(.js) .gate__form { display: none; }
html.is-checking .gate__form { visibility: hidden; }
.gate__note { margin: 0; color: var(--ink-2); }
html.js .gate__note--nojs { display: none; }
.gate__note[hidden] { display: none; }
.fields { display: grid; gap: 10px; }
.field { display: grid; gap: 1px; padding: 12px 18px 13px; border-radius: 20px; background: var(--paper); box-shadow: 0 0 0 1px var(--line); cursor: text; transition: box-shadow .3s var(--ease); }
.field__label { color: var(--ink-2); font-size: .875rem; font-weight: 550; }
.field__input { width: 100%; min-width: 0; margin: 0; padding: 2px 0; border: 0; border-radius: 0; background: none; color: var(--ink); outline: 0; appearance: none; -webkit-appearance: none; font: 500 1.25rem/1.3 var(--face); }
.field__input::placeholder { color: var(--ink-2); opacity: .75; font-weight: 400; }
.field__input:-webkit-autofill { -webkit-text-fill-color: var(--ink); box-shadow: 0 0 0 100px var(--paper) inset; caret-color: var(--cobalt); }
@media (hover: hover) and (pointer: fine) { .field:hover { box-shadow: 0 0 0 1px rgba(20, 18, 16, .32); } }
.field:focus-within { box-shadow: 0 0 0 2px var(--ink); }
.field:has(.field__input:focus-visible) { box-shadow: 0 0 0 3px var(--cobalt); }
.field.field--error, .field.field--error:has(.field__input:focus-visible) { box-shadow: 0 0 0 2px var(--err); }
.field__error { display: flex; gap: .55em; align-items: flex-start; margin: 6px 0 0; color: var(--err); font-weight: 550; font-size: .875rem; line-height: 1.35; }
.field__error::before { content: "!"; flex: none; width: 1.3em; height: 1.3em; display: grid; place-items: center; background: var(--err); color: var(--cream); border-radius: 50%; font-size: .8em; line-height: 1; }
.field__error:empty { display: none; }

/* One thing that is on or off: an empty circle, or ink with a tick in it */
.check { position: relative; display: inline-grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; margin: 20px 0 0 4px; cursor: pointer; -webkit-tap-highlight-color: transparent; font-size: .9375rem; line-height: 1.4; }
.check__input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.check__box { position: relative; width: 22px; height: 22px; margin-top: -.06em; border: 2px solid var(--ink); border-radius: 50%; transition: background-color .25s var(--ease); }
.check__box::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 5.5px; margin: -4.5px 0 0 -5px; border: solid var(--cream); border-width: 0 0 2px 2px; transform: rotate(-45deg) scale(0); transition: transform .3s var(--spring); }
.check__input:checked + .check__box { background: var(--ink); }
.check__input:checked + .check__box::after { transform: rotate(-45deg) scale(1); }
.check__input:focus-visible + .check__box { outline: 3px solid var(--cobalt); outline-offset: 3px; }
@media (hover: none), (pointer: coarse) { .check::after { content: ""; position: absolute; inset: 50% 0 auto; height: 44px; transform: translateY(-50%); } }

/* The way in: ink, cobalt in hand, its arrow stepping on, as every way in on the front page does */
.btn { position: relative; display: inline-flex; align-items: center; gap: 12px; min-height: 56px; margin-top: 26px; padding: 0 22px 0 28px; appearance: none; cursor: pointer; -webkit-tap-highlight-color: transparent; border: 0; border-radius: 999px; background: var(--ink); color: var(--cream); font: 600 1.125rem/1 var(--face); white-space: nowrap; transition: background-color .3s var(--ease), color .3s var(--ease), transform .5s var(--spring); }
.btn svg { width: 22px; height: 22px; transition: transform .55s var(--spring); }
@media (hover: hover) and (pointer: fine) { .btn:hover { background: var(--cobalt); } .btn:hover svg { transform: translateX(4px); } }
.btn:active { background: var(--cobalt); transform: scale(.96); transition-duration: .1s; }
.btn[aria-disabled="true"] { pointer-events: none; background: none; color: var(--ink-2); box-shadow: inset 0 0 0 2px var(--line); }
.btn[aria-disabled="true"] svg { display: none; }

/* Opened: the tangerine rises over the screen, and the work is behind it */
.cross { position: fixed; inset: 0; z-index: 9; background: var(--tangerine); clip-path: inset(100% 0 0 0); pointer-events: none; }
.is-open .cross { clip-path: inset(0 0 0 0); transition: clip-path .5s var(--ease); }

/* Arriving: the panel settles and the lock is stuck on, as on the front page */
@media (prefers-reduced-motion: no-preference) {
  .say__in { animation: settle .9s var(--ease) both; }
  .lock { animation: stick .7s var(--spring) .3s both; }
  @keyframes settle { from { opacity: 0; transform: scale(.985); } }
  @keyframes stick { from { opacity: 0; transform: rotate(-24deg) scale(.6); } }
}

/* Held sideways, or wide: the panel at the left, the form beside it, on one screen. From 1100 wide and 560 high the
   panel is the left third, as the front page's is. */
@media (min-width: 600px) and (orientation: landscape) {
  body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); height: 100svh; min-height: 0; }
  .say { padding: 14px 0 14px 14px; min-height: 0; }
  .say__in { height: 100%; min-height: 0; grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
  .say__in > .lock, .say__in > h1, .say__in > .say__lead { grid-area: 1 / 1; }
  .lock { align-self: start; }
  .say h1 { align-self: center; }
  .say__lead { align-self: end; margin: 0; }
  .door { display: grid; align-content: center; padding: 24px clamp(24px, 5.2vw, 104px); overflow: auto; }
}
@media (min-width: 1100px) and (min-height: 560px) and (orientation: landscape) {
  body { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
  .say__in { padding: clamp(26px, 2.6vw, 44px); }
  /* the form's left edge is the front page list's */
  .door > * { width: min(100%, 54rem); margin-inline: auto; }
  .gate__form, .gate__note { max-width: none; }
  .gate__form > * { max-width: 27rem; }
}
@media (min-width: 600px) and (orientation: landscape) and (max-height: 480px) { .say__lead { display: none; } .btn { margin-top: 18px; } .check { margin-top: 14px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 1ms !important; animation: none !important; } .cross { display: none; } }
</style>
</head>
<body>
<header class="say">
  <div class="say__in">
    <span class="lock" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="5" y="10.5" width="14" height="10" rx="3.5" fill="currentColor"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2.25"/></svg></span>
    <h1><span>Private</span> <span>preview</span></h1>
    <p class="say__lead">It opens with the password you were sent.</p>
  </div>
</header>
<main class="door">
  <form class="gate__form" id="gate" autocomplete="on" novalidate>
    <div class="fields">
      <label class="field"><span class="field__label">Name</span><input class="field__input" id="who" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Any name works"></label>
      <label class="field" id="pw-field"><span class="field__label">Password</span><input class="field__input" id="pw" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required aria-describedby="msg"><p class="field__error" id="msg" role="alert"></p></label>
    </div>
    <div><label class="check"><input class="check__input" id="keep" type="checkbox" checked><span class="check__box" aria-hidden="true"></span><span>Keep me signed in on this device</span></label></div>
    <button class="btn" id="go" type="submit"><span id="go-words">Open the preview</span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4.5 12h14.5M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </form>
  <p class="gate__note gate__note--nojs">This preview needs JavaScript to open.</p>
  <p class="gate__note" id="cant" hidden>This window can’t open the preview. Try a regular (not private) window in Chrome, Edge, Safari or Firefox.</p>
</main>
<div class="cross" aria-hidden="true"></div>
<script>
(function () {
  'use strict';
  var C = { base: '/pkf-preview/', salt: '7sCPNpcUZgtpTk0IXSmDVw==', iter: 600000, home: 'showcase/' };
  // Other previews share this site's storage: this one's key and its count of tries are kept under its own address.
  var K = 'k:' + C.base, TRIES = 'tries:' + C.base;
  var root = document.documentElement, $ = function (s) { return document.querySelector(s); };
  var form = $('#gate'), msg = $('#msg'), btn = $('#go'), words = $('#go-words'), pw = $('#pw');

  // Where to go once it is open: the address that was asked for, or the showcase.
  var q = new URLSearchParams(location.search);
  var here = location.pathname.indexOf(C.base) === 0 ? location.pathname.slice(C.base.length) : '';
  var deep = here !== '' && here !== 'index.html' && here !== '404.html';
  var next = deep ? here + location.search + location.hash : (q.get('next') || C.home);
  if (/^[a-z][a-z0-9+.-]*:|^\/|\\/i.test(next)) next = C.home;

  function cant() { root.classList.remove('is-checking'); form.hidden = true; $('#cant').hidden = false; }
  if (!('serviceWorker' in navigator) || !window.crypto || !crypto.subtle || !window.indexedDB) return cant();

  // The key is kept in this browser, never the password.
  function db() { return new Promise(function (yes, no) { var r = indexedDB.open('preview', 1); r.onupgradeneeded = function () { r.result.createObjectStore('kv'); }; r.onsuccess = function () { yes(r.result); }; r.onerror = function () { no(r.error); }; }); }
  function tx(mode, work) { return db().then(function (d) { return new Promise(function (yes, no) { var t = d.transaction('kv', mode), out = work(t.objectStore('kv')); t.oncomplete = function () { yes(out && out.result); }; t.onerror = function () { no(t.error); }; }); }); }
  var kept = { get: function () { return tx('readonly', function (s) { return s.get(K); }); }, put: function (v) { return tx('readwrite', function (s) { return s.put(v, K); }); }, drop: function () { return tx('readwrite', function (s) { return s.delete(K); }); } };

  function bytes(b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); }
  // Does this key open the list of what is here? true, false, or it throws when the list cannot be fetched.
  function opens(key) {
    return fetch(C.base + 'm.bin', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('unreachable'); return r.arrayBuffer(); }).then(function (buf) {
      var b = new Uint8Array(buf);
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.subarray(0, 12) }, key, b.subarray(12)).then(function () { return true; }, function () { return false; });
    });
  }
  var worker = navigator.serviceWorker.register(C.base + 'sw.js', { scope: C.base }).then(function () { return navigator.serviceWorker.ready; });

  function enter() {
    // back at this sign-in three times within a few seconds, key in hand: this window cannot keep the worker
    var now = Date.now(), t = { at: 0, n: 0 };
    try { t = JSON.parse(sessionStorage.getItem(TRIES)) || t; } catch (e) {}
    t = now - t.at < 8000 ? { at: now, n: t.n + 1 } : { at: now, n: 1 };
    try { sessionStorage.setItem(TRIES, JSON.stringify(t)); } catch (e) {}
    if (t.n > 2) return cant();
    return worker.then(function (reg) { if (reg.active) reg.active.postMessage('fresh'); location.replace(C.base + next); });
  }
  function show(text) { root.classList.remove('is-checking'); if (text) say(text); pw.focus(); }
  function say(text) { msg.textContent = text; $('#pw-field').classList.toggle('field--error', !!text); busy(false); }
  // While it is opening the button keeps the width it had, read before its words change to the shorter ones.
  function busy(on) { btn.style.minWidth = on ? getComputedStyle(btn).width : ''; btn.setAttribute('aria-disabled', on ? 'true' : 'false'); words.textContent = on ? 'Opening' : 'Open the preview'; }

  if (q.has('out')) { kept.drop().then(function () { return worker; }).then(function (reg) { if (reg.active) reg.active.postMessage('fresh'); }).catch(function () {}).then(function () { show(''); }); }
  else kept.get().then(function (rec) {
    if (!rec || (rec.exp && rec.exp < Date.now())) return false;
    return opens(rec.key);
  }).then(function (ok) { return ok ? enter() : show(''); }).catch(function () { show(''); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (btn.getAttribute('aria-disabled') === 'true') return;
    if (!pw.value) return say('Enter the password to open the preview.');
    msg.textContent = ''; busy(true);
    crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(C.salt), iterations: C.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (key) {
      return opens(key).then(function (ok) {
        if (!ok) { say('That password doesn’t open this preview. Check it and try again.'); pw.select(); return; }
        return kept.put({ key: key, exp: $('#keep').checked ? 0 : Date.now() + 12 * 3600 * 1000 }).then(function () {
          try { sessionStorage.removeItem(TRIES); } catch (e) {}
          root.classList.add('is-open');
          var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
          setTimeout(enter, still ? 0 : 480);
        });
      });
    }).catch(function () { say('The preview couldn’t be reached. Check the connection and try again.'); });
  });
})();
</script>
</body>
</html>
